[project]
name = "sluice"
version = "0.1.0"
description = "Sluice — 可挂载 Skill 的数据 Agent 平台（自研 harness）"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]
graph = ["langgraph>=0.2"]

[project.scripts]
sluice = "sluice.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
